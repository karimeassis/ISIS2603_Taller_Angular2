<div class="card mb-4">
  <div class="card-body">
    <h5 class="card-title">Nueva Ciudad</h5>
    <div class="mb-3">
      <label for="cityName" class="form-label">Nombre de la ciudad</label>
      <input
        id="cityName"
        name="cityName"
        type="text"
        class="form-control"
        [(ngModel)]="cityName">
    </div>

    <div class="mb-3">
      <label for="countryId" class="form-label">País</label>
      <select
        id="countryId"
        name="countryId"
        class="form-select"
        [(ngModel)]="selectedCountryId">
        <option [ngValue]="null">Seleccione un país</option>
        @for (country of countries; track country.id) {
          <option [ngValue]="country.id">{{ country.name }}</option>
        }
      </select>
    </div>

    <div class="d-flex gap-2">
      <button
        type="button"
        class="btn btn-success"
        [disabled]="cityName.trim() === '' || selectedCountryId === null"
        (click)="onSave()">
        Guardar
      </button>
      <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">
        Cancelar
      </button>
    </div>
  </div>
</div>
